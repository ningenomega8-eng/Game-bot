<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta property="og:title" content="Tembak Alien">
<meta property="og:description" content="Hancurkan semua alien sebelum mereka mendarat!">
<meta property="og:type" content="website">
<meta name="description" content="Hancurkan semua alien sebelum mereka mendarat!">
<title>Tembak Alien</title>
<style>
  :root{--bg:#0b0f1e;--card:#151b33;--ink:#eef2ff;--mute:#8b97bd;--hot:#ff3b4e;--acc:#7cf0c8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:10px}
  .head{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:flex-end}
  .tag{font-size:11px;letter-spacing:.14em;color:var(--hot);text-transform:uppercase}
  h1{margin:2px 0 0;font-size:22px}
  .sc{text-align:right}.sc b{font-size:28px;display:block;line-height:1}.sc span{font-size:11px;color:var(--mute)}
  canvas{width:100%;max-width:420px;max-height:calc(100vh - 230px);aspect-ratio:360/480;background:#05070f;border-radius:14px;display:block}
  .pad{width:100%;max-width:420px;display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:8px}
  .pad button{height:58px;border:0;border-radius:12px;background:var(--card);color:var(--ink);font-size:14px;font-weight:700;letter-spacing:.06em}
  .pad button.fire{background:var(--hot)}
  .pad button:active{filter:brightness(1.3)}
  .info{font-size:12px;color:var(--mute);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><div class="tag">Game Bot</div><h1>Tembak Alien</h1></div>
    <div class="sc"><b id="score">0</b><span>TERBAIK <span id="best">0</span></span></div>
  </div>
  <canvas id="c" width="360" height="480"></canvas>
  <div class="pad">
    <button id="bl">◀ KIRI</button>
    <button id="bf" class="fire">✦ TEMBAK</button>
    <button id="br">KANAN ▶</button>
  </div>
  <div class="info" id="info">Tap layar atau tombol TEMBAK untuk mulai</div>
</div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=360,H=480;
  var scoreEl=document.getElementById('score'),info=document.getElementById('info');
  var best=0;try{best=+localStorage.getItem('ta_best')||0}catch(e){}
  document.getElementById('best').textContent=best;

  var state='ready',ship,bullets,ebullets,aliens,dir,speed,score,lives,wave,left=false,right=false,cool=0,frame=0,stars=[];
  for(var i=0;i<50;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:.3+Math.random()*1});

  function spawn(){
    aliens=[];var rows=Math.min(3+Math.floor(wave/2),5),cols=7;
    for(var r=0;r<rows;r++)for(var c=0;c<cols;c++)aliens.push({x:30+c*40,y:50+r*32,r:r});
    dir=1;speed=.5+wave*.18;
  }
  function reset(){
    ship={x:W/2,y:H-36,w:30,h:16};bullets=[];ebullets=[];score=0;lives=3;wave=0;spawn();
    scoreEl.textContent=0;
  }
  reset();

  function start(){
    if(state==='ready'||state==='over'){if(state==='over')reset();state='play';info.textContent='Hancurkan semua alien!'}
  }
  function shoot(){
    start();
    if(state!=='play'||cool>0)return;
    bullets.push({x:ship.x,y:ship.y-12});cool=14;
  }
  function hold(id,fn,up){
    var el=document.getElementById(id);
    el.addEventListener('pointerdown',function(e){e.preventDefault();fn()});
    ['pointerup','pointerleave','pointercancel'].forEach(function(ev){el.addEventListener(ev,up||function(){})});
  }
  hold('bl',function(){left=true;start()},function(){left=false});
  hold('br',function(){right=true;start()},function(){right=false});
  var fireTimer=null;
  hold('bf',function(){shoot();clearInterval(fireTimer);fireTimer=setInterval(shoot,200)},function(){clearInterval(fireTimer)});
  cv.addEventListener('pointerdown',function(e){e.preventDefault();start()});
  window.addEventListener('keydown',function(e){
    if(e.code==='ArrowLeft'){left=true;start()}
    if(e.code==='ArrowRight'){right=true;start()}
    if(e.code==='Space'){e.preventDefault();shoot()}
  });
  window.addEventListener('keyup',function(e){if(e.code==='ArrowLeft')left=false;if(e.code==='ArrowRight')right=false});

  function over(){
    state='over';
    if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('ta_best',best)}catch(e){}}
    info.textContent='Game over • tap untuk main lagi';
  }

  function update(){
    frame++;
    stars.forEach(function(s){s.y+=s.s;if(s.y>H){s.y=0;s.x=Math.random()*W}});
    if(state!=='play')return;
    if(cool>0)cool--;
    if(left)ship.x-=4;if(right)ship.x+=4;
    ship.x=Math.max(20,Math.min(W-20,ship.x));
    bullets.forEach(function(b){b.y-=7});bullets=bullets.filter(function(b){return b.y>-10});
    ebullets.forEach(function(b){b.y+=2.6+wave*.2});ebullets=ebullets.filter(function(b){return b.y<H+10});

    var edge=false;
    aliens.forEach(function(a){a.x+=dir*speed;if(a.x<14||a.x>W-14)edge=true});
    if(edge){dir*=-1;aliens.forEach(function(a){a.y+=14})}

    if(aliens.length&&Math.random()<.02+wave*.004){
      var a=aliens[Math.floor(Math.random()*aliens.length)];ebullets.push({x:a.x,y:a.y+8});
    }
    for(var i=aliens.length-1;i>=0;i--){
      var al=aliens[i];
      for(var j=bullets.length-1;j>=0;j--){
        var b=bullets[j];
        if(Math.abs(b.x-al.x)<14&&Math.abs(b.y-al.y)<10){
          aliens.splice(i,1);bullets.splice(j,1);score+=10+al.r*0;scoreEl.textContent=score;break;
        }
      }
    }
    for(var k=ebullets.length-1;k>=0;k--){
      var e=ebullets[k];
      if(Math.abs(e.x-ship.x)<16&&Math.abs(e.y-ship.y)<12){ebullets.splice(k,1);lives--;if(lives<=0)over()}
    }
    for(var m=0;m<aliens.length;m++)if(aliens[m].y>=ship.y-14){over();break}
    if(state==='play'&&!aliens.length){wave++;score+=50;scoreEl.textContent=score;spawn();ebullets=[]}
  }

  function alien(x,y,r,t){
    var cols=['#ff5b6e','#ffb14a','#7cf0c8','#6ea8ff','#d58bff'];
    ctx.fillStyle=cols[r%5];
    ctx.fillRect(x-10,y-5,20,10);ctx.fillRect(x-6,y-9,12,4);
    var leg=Math.floor(t/20)%2;
    ctx.fillRect(x-12+leg*2,y+5,4,4);ctx.fillRect(x+8-leg*2,y+5,4,4);
    ctx.fillStyle='#05070f';ctx.fillRect(x-6,y-3,3,3);ctx.fillRect(x+3,y-3,3,3);
  }

  function draw(){
    ctx.fillStyle='#05070f';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';stars.forEach(function(s){ctx.globalAlpha=.3+s.s*.4;ctx.fillRect(s.x,s.y,1.4,1.4)});ctx.globalAlpha=1;
    aliens.forEach(function(a){alien(a.x,a.y,a.r,frame)});
    ctx.fillStyle='#fff';bullets.forEach(function(b){ctx.fillRect(b.x-1.5,b.y-7,3,10)});
    ctx.fillStyle='#ff8a3d';ebullets.forEach(function(b){ctx.fillRect(b.x-1.5,b.y,3,9)});
    ctx.fillStyle='#7cf0c8';
    ctx.beginPath();ctx.moveTo(ship.x,ship.y-14);ctx.lineTo(ship.x+15,ship.y+8);ctx.lineTo(ship.x-15,ship.y+8);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffd23f';ctx.fillRect(ship.x-3,ship.y+8,6,3+(frame%6<3?3:0));
    ctx.font='12px system-ui';ctx.textAlign='left';ctx.fillStyle='#8b97bd';
    ctx.fillText('NYAWA '+'♥'.repeat(Math.max(lives,0)),10,18);
    ctx.textAlign='right';ctx.fillText('GELOMBANG '+(wave+1),W-10,18);
    ctx.textAlign='center';
    if(state==='ready'){ctx.fillStyle='#ff3b4e';ctx.font='bold 26px system-ui';ctx.fillText('TEMBAK ALIEN',W/2,H/2-10);ctx.fillStyle='#cfd8ff';ctx.font='13px system-ui';ctx.fillText('Tap untuk mulai',W/2,H/2+16)}
    if(state==='over'){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(40,H/2-60,W-80,110);ctx.fillStyle='#ffd23f';ctx.font='bold 26px system-ui';ctx.fillText('GAME OVER',W/2,H/2-18);ctx.fillStyle='#fff';ctx.font='16px system-ui';ctx.fillText('Skor '+score+' • Terbaik '+best,W/2,H/2+12);ctx.fillStyle='#cfd8ff';ctx.font='13px system-ui';ctx.fillText('Tap untuk main lagi',W/2,H/2+36)}
  }
  (function loop(){update();draw();requestAnimationFrame(loop)})();
})();
</script>
</body>
</html>
